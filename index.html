<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Онлайн-каталог продукции</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #f4f7f6;
            color: #333;
            padding-bottom: 50px;
        }
        header {
            background-color: #075e54;
            color: white;
            padding: 15px 20px;
            text-align: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
            position: sticky;
            top: 0;
            z-index: 1000;
        }
        header h1 {
            font-size: 20px;
            margin-bottom: 3px;
        }
        header p {
            font-size: 13px;
            opacity: 0.9;
        }
        .filter-container {
            background: white;
            padding: 12px 15px;
            display: flex;
            gap: 10px;
            overflow-x: auto;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            position: sticky;
            top: 65px;
            z-index: 999;
            white-space: nowrap;
        }
        .filter-btn {
            background-color: #f0f2f5;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 600;
            color: #555;
            cursor: pointer;
            transition: all 0.2s;
        }
        .filter-btn:hover {
            background-color: #e4e6eb;
        }
        .filter-btn.active {
            background-color: #075e54;
            color: white;
        }
        .container {
            max-width: 1200px;
            margin: 20px auto;
            padding: 0 15px;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
        }
        .card {
            background: white;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
            display: flex;
            flex-direction: column;
            transition: transform 0.2s;
            max-width: 380px;
            width: 100%;
            justify-self: start;
        }
        .card:hover {
            transform: translateY(-5px);
        }
        .card img {
            width: 100%;
            height: 200px;
            object-fit: cover;
            background-color: #e0e0e0;
        }
        .card-body {
            padding: 15px;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
        }
        .card-title {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 8px;
            color: #2c3e50;
        }
        .card-desc {
            font-size: 14px;
            color: #666;
            margin-bottom: 15px;
            flex-grow: 1;
        }
        .card-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: auto;
        }
        .price {
            font-size: 18px;
            font-weight: 700;
            color: #27ae60;
        }
        .btn-order {
            background-color: #075e54;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }
        .btn-order:hover {
            background-color: #0b6b60;
        }
    </style>
</head>
<body>

    <header>
        <h1>Наш каталог продукции</h1>
        <p>Выберите товар и оформите заказ в один клик через WhatsApp</p>
    </header>

    <div class="filter-container" id="filter-buttons"></div>

    <div class="container" id="product-list"></div>

    <script>
        // ВАШ НОМЕР WHATSAPP (без плюса)
        const whatsappNumber = "994505750978";

        // ВСТАВЬТЕ СЮДА ВАШУ НОВУЮ ССЫЛКУ ИЗ GOOGLE APPS SCRIPT (заканчивается на /exec)
        const googleScriptUrl = "https://script.google.com/macros/s/AKfycbzCemJ5Lw_SNzmyyeajvCscZJDs7_9lvRGwII3XLmyC3u54dDsY9WysTXi2yunQsMm64Q/exec";

        const products = [
            {
                id: 1,
                name: "Умные часы",
                category: "electronics",
                description: "Стильные смарт-часы с трекером активности и уведомлениями.",
                price: "1500 руб.",
                image: "https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=500&auto=format&fit=crop&q=60"
            },
            {
                id: 2,
                name: "Беспроводные наушники",
                category: "electronics",
                description: "Гарнитура с чистым звуком и долгим временем работы.",
                price: "2400 руб.",
                image: "https://images.unsplash.com/photo-1505740420928-5e560c06d30e?w=500&auto=format&fit=crop&q=60"
            },
            {
                id: 3,
                name: "Спортивные кроссовки",
                category: "shoes",
                description: "Легкие и удобные кроссовки для бега и повседневной носки.",
                price: "3200 руб.",
                image: "https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=500&auto=format&fit=crop&q=60"
            },
            {
                id: 4,
                name: "Стильный рюкзак",
                category: "accessories",
                description: "Вместительный городской рюкзак с отделением для ноутбука.",
                price: "1900 руб.",
                image: "https://images.unsplash.com/photo-1553062407-98eeb64c6a62?w=500&auto=format&fit=crop&q=60"
            }
        ];

        const categories = [
            { id: "all", name: "Все товары" },
            { id: "electronics", name: "Электроника" },
            { id: "shoes", name: "Обувь" },
            { id: "accessories", name: "Аксессуары" }
        ];

        const filterContainer = document.getElementById('filter-buttons');
        const productContainer = document.getElementById('product-list');
        let currentCategory = "all";

        function renderFilters() {
            filterContainer.innerHTML = '';
            categories.forEach(cat => {
                const btn = document.createElement('button');
                btn.className = `filter-btn ${cat.id === currentCategory ? 'active' : ''}`;
                btn.textContent = cat.name;
                btn.onclick = () => {
                    currentCategory = cat.id;
                    renderFilters();
                    renderProducts();
                };
                filterContainer.appendChild(btn);
            });
        }

        function renderProducts() {
            productContainer.innerHTML = '';
            const filteredProducts = currentCategory === "all" 
                ? products 
                : products.filter(p => p.category === currentCategory);

            filteredProducts.forEach(product => {
                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `
                    <img src="${product.image}" alt="${product.name}">
                    <div class="card-body">
                        <div class="card-title">${product.name}</div>
                        <div class="card-desc">${product.description}</div>
                        <div class="card-footer">
                            <span class="price">${product.price}</span>
                            <button class="btn-order" onclick="orderProduct('${product.name}', '${product.price}', '${product.image}')">
                                Заказать
                            </button>
                        </div>
                    </div>
                `;
                productContainer.appendChild(card);
            });
        }

        function orderProduct(name, price, image) {
            // Отправка данных в Google Таблицу через text/plain (обход CORS блокировок)
            if (googleScriptUrl && googleScriptUrl.startsWith("http")) {
                fetch(googleScriptUrl, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: {
                        'Content-Type': 'text/plain;charset=utf-8',
                    },
                    body: JSON.stringify({ name: name, price: price, image: image })
                }).catch(err => console.log('Запрос отправлен'));
            }

            // Открытие WhatsApp
            const message = `Здравствуйте! Я хочу заказать товар:\n▪️ *${name}*\n▪️ Цена: ${price}\n▪️ Фото: ${image}\n\nУточните, пожалуйста, наличие.`;
            const url = `https://wa.me/${whatsappNumber}?text=${encodeURIComponent(message)}`;
            window.open(url, '_blank');
        }

        renderFilters();
        renderProducts();
    </script>
</body>
</html>

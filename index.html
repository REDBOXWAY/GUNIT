<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Наш каталог продукции</title>
    
    <!-- Стили -->
    <link rel="stylesheet" href="style.css">

    <!-- Подключаем библиотеку Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

    <header>
        <h1>Наш каталог продукции</h1>
        <p>Выберите товар и оформите заказ в один клик через WhatsApp</p>
    </header>

    <main>
        <!-- Контейнер для товаров -->
        <div id="product-list"></div>
    </main>

    <!-- Логика каталога и отправки заказов в Supabase -->
    <script>
        // Настройки подключения к Supabase
        const SUPABASE_URL = 'https://ikiczqwiziffnulnlpvb.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_uxtVE-nD92Z4xpi1fX_Xtg_9vhS_oEI';

        // Инициализация клиента Supabase
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        // Функция отправки заказа в базу
        async function submitOrder(productName, productPrice, productImage) {
            try {
                const { data, error } = await _supabase
                    .from('orders')
                    .insert([
                        { 
                            name: productName, 
                            price: productPrice, 
                            image: productImage 
                        }
                    ]);

                if (error) {
                    throw error;
                }

                console.log('Заказ успешно сохранен в Supabase:', data);
                alert('Заказ успешно оформлен!');
                
            } catch (err) {
                console.error('Ошибка при оформлении заказа:', err.message);
                alert('Не удалось отправить заказ. Ошибка: ' + err.message);
            }
        }

        // Обработка клика по кнопке «Заказать» в карточке товара
        document.addEventListener('click', function(event) {
            const btn = event.target.closest('button') || event.target.closest('.order-btn') || event.target;
            
            if (btn && (btn.innerText.includes('Заказать') || btn.classList.contains('buy-btn'))) {
                const card = btn.closest('.product-card') || btn.closest('div');
                if (!card) return;
                
                const nameEl = card.querySelector('h3') || card.querySelector('.product-name');
                const priceEl = card.querySelector('.price') || card.querySelector('.product-price');
                const imgEl = card.querySelector('img');

                const productName = nameEl ? nameEl.innerText.trim() : 'Товар';
                const productPrice = priceEl ? priceEl.innerText.trim() : '';
                const productImage = imgEl ? imgEl.src : '';

                submitOrder(productName, productPrice, productImage);
            }
        });
    </script>
</body>
</html>
